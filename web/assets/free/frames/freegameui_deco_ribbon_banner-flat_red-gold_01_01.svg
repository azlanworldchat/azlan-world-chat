<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" fill="none">
  <!-- 1. 奥の尻尾（左右・平らな端 = banner-flat） -->
  <path d="M6,114 H70 V166 H6 Z" fill="#8E1520"/>
  <path d="M250,114 H186 V166 H250 Z" fill="#8E1520"/>
  <!-- 2. 折り返し（前面帯の下端角 → 尻尾をつなぐ三角） -->
  <path d="M48,152 H70 V166 Z" fill="#4E0910"/>
  <path d="M208,152 H186 V166 Z" fill="#4E0910"/>
  <!-- 3. 前面の帯 -->
  <rect x="48" y="92" width="160" height="60" fill="#C8202F"/>
  <!-- 4. 上側の光 -->
  <rect x="48" y="92" width="160" height="14" fill="#E04452"/>
  <!-- 5. 縁取り（金） -->
  <rect x="48" y="99" width="160" height="3" fill="#E8B84A"/>
  <rect x="48" y="142" width="160" height="3" fill="#C9962E"/>
  <!-- 6. 外形線 -->
  <rect x="48" y="92" width="160" height="60" stroke="#3A070C" stroke-width="2"/>
</svg>
