name: Unzip source
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble split ZIP if present
        run: |
          if [ -f azlan-world-chat-source.zip.part-aa ] && [ -f azlan-world-chat-source.zip.part-ab ] && [ -f azlan-world-chat-source.zip.part-ac ] && [ -f azlan-world-chat-source.zip.part-ad ] && [ -f azlan-world-chat-source.zip.part-ae ] && [ -f azlan-world-chat-source.zip.part-af ] && [ -f azlan-world-chat-source.zip.part-ag ]; then
            cat azlan-world-chat-source.zip.part-* > azlan-world-chat-source.zip
            rm azlan-world-chat-source.zip.part-*
          else
            echo "Split ZIP incomplete - waiting for all 7 parts (aa-ag)"
          fi
      - name: Extract ZIP to repo root
        run: |
          if [ ! -f azlan-world-chat-source.zip ]; then echo "No ZIP to extract"; exit 0; fi
          unzip -o azlan-world-chat-source.zip
          rm azlan-world-chat-source.zip
          for d in */; do
            if [ -f "$d/server.js" ]; then
              shopt -s dotglob
              cp -a "$d"/. ./
              rm -rf "$d"
              break
            fi
          done
          ls -la
          test -f server.js && test -f package.json && test -f index.html
      - name: Commit extracted files
        run: |
          git config user.name "azlanworldchat"
          git config user.email "alidhuddi60@gmail.com"
          git add -A
          git diff --cached --quiet || git commit -m "Extract AZLAN WORLD CHAT source files"
          git push
