<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bd" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C8A048"/>
      <stop offset="50%" stop-color="#907020"/>
      <stop offset="100%" stop-color="#504000"/>
    </linearGradient>
    <clipPath id="inner">
      <rect x="8" y="8" width="240" height="240" rx="7" ry="7"/>
    </clipPath>
  </defs>
  <!-- Border (gradient outline with shadow) -->
  <rect x="1" y="1" width="254" height="254" rx="14" ry="14" fill="url(#bd)"/>
  <!-- Highlight band -->
  <rect x="4" y="4" width="248" height="248" rx="11" ry="11" fill="#B09038"/>
  <!-- Inner line (dark accent) -->
  <rect x="6" y="6" width="244" height="244" rx="9" ry="9" fill="#3A2200"/>
  <!-- Body (flat solid) -->
  <rect x="8" y="8" width="240" height="240" rx="7" ry="7" fill="#2A2A30"/>
  <!-- Header area -->
  <rect clip-path="url(#inner)" x="8" y="8" width="240" height="36" fill="#353540"/>
  <!-- Separator -->
  <rect x="8" y="44" width="240" height="1" fill="#5A4010"/>
</svg>